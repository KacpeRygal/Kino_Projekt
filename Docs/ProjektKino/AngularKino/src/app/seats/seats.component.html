<div class="container">
  <h1>Select seats</h1>
  <div class="screen"></div>
  <div class="seats">
    <div *ngFor="let row of seatsDisplay; let rowIndex = index" class="seat-row">
      <div *ngFor="let seat of row; let seatIndex = index" 
           [ngClass]="{
             'seat': true, 
             'occupied': seat === 'occupied', 
             'selected': seat === 'selected', 
             'available': seat === 'available'
           }"
           (click)="toggleSeat(rowIndex, seatIndex)"
           [attr.data-row]="rowIndex"
           [attr.data-column]="seatIndex">
      </div>
    </div>
  </div>
  <div class="bottom-section">
    <div class="info">
      <div>
        <span class="label">Movie name:</span>
        <span class="value">{{movie?.name}}</span>
      </div>
      <div>
        <span class="label">Date:</span>
        <span class="value">{{dateString}}</span>
      </div>
      <div>
        <span class="label">Hour:</span>
        <span class="value">{{hourString}}</span>
      </div>
      <div>
        <span class="label">Hall number:</span>
        <span class="value">{{hall.id}}</span>
      </div>
      <div *ngIf="selectedSeatRow !== undefined && selectedSeatColumn !== undefined">
        <span class="label">Choosed seat:</span>
        <span class="value">Row: {{selectedSeatRow + 1}}, Column: {{selectedSeatColumn + 1}}</span>
      </div>
    </div>
    <button class="buy-button" *ngIf="!zakupiono"(click)="buyTicket()">Buy</button>
    <button class="buy-button" *ngIf="zakupiono">Already purchased</button>
  </div>
</div>
